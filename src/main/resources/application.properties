spring.application.name=ACMS
server.port = 8081

# --- Database (values come from environment variables) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acms_db}
spring.datasource.username=${DB_USERNAME:acms_user}
spring.datasource.password=${DB_PASSWORD:Cresc@2004}

# --- JPA / Hibernate ---
# validate = only CHECK that entities match the tables. Never create or change tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT authentication ---
acms.security.jwt.secret=${ACMS_JWT_SECRET:}
acms.security.jwt.issuer=${ACMS_JWT_ISSUER:acms-api}
acms.security.jwt.ttl-minutes=${ACMS_JWT_TTL_MINUTES:30}
