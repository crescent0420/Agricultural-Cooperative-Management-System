spring.application.name=ACMS
server.port = 8081
spring.config.import=optional:file:.env[.properties]

# --- Database (values come from environment variables or .env) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acms_db}
spring.datasource.username=${DB_USERNAME:acms_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# validate = only CHECK that entities match the tables. Never create or change tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT authentication ---
acms.security.jwt.secret=${ACMS_JWT_SECRET:}
acms.security.jwt.issuer=${ACMS_JWT_ISSUER:acms-api}
acms.security.jwt.ttl-minutes=${ACMS_JWT_TTL_MINUTES:30}

# --- Email ---
# Defaults suit Mailpit (localhost:1025, no login). For Gmail, set the MAIL_* values in .env.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Account emails ---
acms.mail.from=${MAIL_FROM:ACMS <no-reply@acms.local>}
# The verification link in the email starts with this address.
acms.app.base-url=${APP_BASE_URL:http://localhost:8081}
