spring.application.name=ACMS

# Every developer-specific or secret value lives in .env (git-ignored); see .env.example.
# A real environment variable with the same name always wins over .env.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}

# --- Database: no defaults on purpose. If .env is missing a value, the app stops with a clear message. ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# validate = only CHECK that entities match the tables. Never create or change tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT authentication ---
acms.security.jwt.secret=${ACMS_JWT_SECRET:}
acms.security.jwt.issuer=${ACMS_JWT_ISSUER:acms-api}
acms.security.jwt.ttl-minutes=${ACMS_JWT_TTL_MINUTES:30}

# --- Email ---
# Defaults suit Mailpit (localhost:1025, no login). For Gmail, set the MAIL_* values in .env.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Account emails ---
acms.mail.from=${MAIL_FROM:ACMS <no-reply@acms.local>}
# Address of the web app (the React frontend). The verification link in the email opens its page
# <address>/verify-email?token=..., which confirms through GET /api/auth/verify-email.
# Development: the Vite server on 5173. Production: the public HTTPS address (deploy/compose.yaml sets it).
acms.app.base-url=${APP_BASE_URL:http://localhost:5173}

# --- Demo data: OFF unless APP_DEMO_SEED=true. Only fills an EMPTY system (see DemoDataSeeder). ---
acms.demo-seed.enabled=${APP_DEMO_SEED:false}
acms.demo-seed.password=${DEMO_SEED_PASSWORD:}
