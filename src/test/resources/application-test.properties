# Used only by the automated tests (profile "test").
# Same server, login and port as development (from .env), but a SEPARATE database:
# the tests create and change data, so they must never touch the development database.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_TEST_NAME:acms_test}

# Test-only signing key. It protects nothing real; real keys stay in .env.
acms.security.jwt.secret=test-only-signing-key-for-automated-tests-0123456789

# Emails are replaced by a fake (mock) in the tests, so nothing is ever sent.
spring.mail.host=localhost
acms.app.base-url=http://localhost
